name: Feature Request
description: 提交新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请尽量说明背景与收益。

  - type: textarea
    id: background
    attributes:
      label: 背景与痛点
      description: 当前流程有什么不便？
      placeholder: 描述你遇到的实际问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的功能行为是什么？
      placeholder: 描述功能目标与预期交互
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
      placeholder: 可选

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、截图、示例等
